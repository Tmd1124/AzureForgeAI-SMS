<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'">
<link rel="icon" href="data:,">
<title>ForgeLink</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #14202e; --soft: #5b6776; --faint: #8a95a3;
    --line: #e1e6eb; --accent: #1faa55; --accent-ink: #ffffff; --bubble-in: #eef1f4; --hover: #f0f3f6;
    --unread: #0ea5e9; --danger: #dc2626; --mark: #facc15;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --panel: #151d26; --ink: #e6ecf1; --soft: #a9b5c1; --faint: #7d8a97;
      --line: #25313d; --accent: #22c55e; --accent-ink: #06210f; --bubble-in: #1f2a36; --hover: #1b2530;
      --unread: #38bdf8; --danger: #f87171; --mark: #facc15;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  [hidden] { display: none !important; }

  /* Pairing */
  #pair { height: 100%; display: grid; place-items: center; padding: 16px; }
  .pair-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(380px, 100%); display: grid; gap: 14px; text-align: center; }
  .pair-card h1 { margin: 0; font-size: 1.5rem; }
  .pair-card p { margin: 0; color: var(--soft); }
  #code { font-size: 1.8rem; letter-spacing: 0.35em; text-align: center; font-family: ui-monospace, Consolas, monospace; }
  .primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
  .primary:disabled { opacity: 0.5; cursor: default; }
  .error { color: var(--danger); min-height: 1.4em; margin: 0; }

  /* App */
  #app { height: 100%; display: grid; grid-template-columns: minmax(280px, 360px) 1fr; }
  #sidebar { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .side-head h1 { margin: 0; font-size: 1.2rem; }
  .icon-btn { border: none; background: transparent; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; }
  .icon-btn:hover { background: var(--hover); }
  .tabs { display: flex; gap: 6px; padding: 0 12px 8px; }
  .tab { flex: 1; border: none; border-radius: 999px; padding: 6px 4px; background: var(--hover); font-weight: 600; font-size: 0.85rem; }
  .tab.on { background: var(--accent); color: var(--accent-ink); }
  #search { margin: 0 12px 8px; }
  #list { overflow-y: auto; flex: 1; min-height: 0; }
  .conv { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border: none; background: transparent; text-align: left; border-bottom: 1px solid var(--line); }
  .conv:hover, .conv.active { background: var(--hover); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 0.85rem; }
  .conv-main { flex: 1; min-width: 0; display: block; }
  #list { overflow-x: hidden; }
  .conv-top { display: flex; justify-content: space-between; gap: 8px; }
  .conv-name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { color: var(--faint); font-size: 0.78rem; flex-shrink: 0; }
  .conv-preview { display: block; color: var(--soft); font-size: 0.87rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv.unread .conv-name::after { content: " ●"; color: var(--unread); }
  .conv.unread .conv-preview { color: var(--ink); }
  .section-label { padding: 10px 16px 4px; color: var(--faint); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  mark { background: var(--mark); color: #111; border-radius: 3px; padding: 0 1px; }
  .muted-note { padding: 16px; color: var(--faint); text-align: center; }

  #main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #empty { flex: 1; display: grid; place-items: center; color: var(--faint); padding: 16px; text-align: center; }
  #thread { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .thread-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .thread-head h2 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #back { display: none; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
  .day { align-self: center; color: var(--faint); font-size: 0.78rem; margin: 12px 0 4px; }
  .msg { display: flex; flex-direction: column; max-width: min(75%, 560px); }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .msg.in { align-self: flex-start; align-items: flex-start; }
  .sender { font-size: 0.75rem; color: var(--faint); margin: 0 0 2px 10px; }
  .bubble { padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .out .bubble { background: var(--accent); color: var(--accent-ink); }
  .in .bubble { background: var(--bubble-in); }
  .bubble a { color: inherit; }
  .bubble img { display: block; max-width: 100%; max-height: 260px; border-radius: 10px; margin-top: 4px; cursor: zoom-in; }
  .bubble.photo-only { padding: 0; background: transparent !important; }
  .attach { margin-top: 4px; opacity: 0.9; }
  .reactions { margin: -4px 8px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 0.85rem; }
  .meta { font-size: 0.72rem; color: var(--faint); margin: 2px 6px 4px; }
  .composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; max-height: 160px; min-height: 42px; }
  #banner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #b45309; color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; z-index: 20; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 20; }

  /* New message dialog + photo viewer */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .dialog { background: var(--panel); border-radius: 16px; width: min(460px, 100%); padding: 18px; display: grid; gap: 10px; }
  .dialog h2 { margin: 0; font-size: 1.1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--hover); border: none; border-radius: 999px; padding: 3px 10px; font-size: 0.85rem; }
  .suggestions { max-height: 200px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
  .suggestion { width: 100%; text-align: left; border: none; background: transparent; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .suggestion:hover { background: var(--hover); }
  .suggestion small { display: block; color: var(--faint); }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .secondary { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 10px 16px; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; }
    #app.show-thread #sidebar { display: none; }
    #app:not(.show-thread) #main { display: none; }
    #back { display: inline-grid; place-items: center; }
  }
</style>
</head>
<body>

<div id="pair" hidden>
  <form class="pair-card" id="pairForm" autocomplete="off">
    <h1>ForgeLink</h1>
    <p>Enter the 6-digit code shown on your phone under Menu → Computer access.</p>
    <input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" aria-label="Pairing code" required>
    <p class="error" id="pairError"></p>
    <button class="primary" id="pairButton" type="submit">Pair</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-head">
      <h1>ForgeLink</h1>
      <button class="icon-btn" id="newButton" title="New message" aria-label="New message">✎</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-lane="chats">Chats</button>
      <button class="tab" data-lane="updates">Updates</button>
      <button class="tab" data-lane="screener">Screener</button>
    </div>
    <input id="search" type="search" placeholder="Search messages" aria-label="Search messages">
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="empty">Pick a conversation to read it here.</div>
    <section id="thread" hidden>
      <div class="thread-head">
        <button class="icon-btn" id="back" title="Back" aria-label="Back">←</button>
        <h2 id="threadName"></h2>
      </div>
      <div id="messages"></div>
      <form class="composer" id="composer">
        <textarea id="reply" rows="1" placeholder="Text message" aria-label="Reply"></textarea>
        <button class="primary" id="sendButton" type="submit">Send</button>
      </form>
    </section>
  </main>
</div>

<div class="overlay" id="newDialog" hidden>
  <form class="dialog" id="newForm" autocomplete="off">
    <h2>New message</h2>
    <div class="chips" id="chips"></div>
    <input id="to" placeholder="Name or phone number (Enter to add)" aria-label="Recipient">
    <div class="suggestions" id="suggestions" hidden></div>
    <textarea id="newText" rows="3" placeholder="Text message" aria-label="Message"></textarea>
    <p class="error" id="newError"></p>
    <div class="row">
      <button class="secondary" type="button" id="newCancel">Cancel</button>
      <button class="primary" type="submit">Send</button>
    </div>
  </form>
</div>

<div class="overlay" id="viewer" hidden><img id="viewerImg" alt=""></div>
<div id="banner" hidden>Reconnecting to your phone…</div>
<div id="toast" hidden></div>

<script>
"use strict";

// All text from the phone is written with textContent — never as HTML.
const $ = id => document.getElementById(id);
const state = {
  token: readToken(), lane: "chats", conversations: [], current: null,
  messages: [], hasMore: true, before: null, reloads: 0, loadingOlder: false, sending: false, events: null, searchTimer: null,
  recipients: [], contactTimer: null
};
const PALETTE = ["#e11d48", "#7c3aed", "#0ea5e9", "#16a34a", "#f59e0b", "#db2777", "#0d9488", "#6366f1"];

function readToken() { try { return localStorage.getItem("forgelink_token"); } catch { return null; } }
function writeToken(token) {
  try { token ? localStorage.setItem("forgelink_token", token) : localStorage.removeItem("forgelink_token"); } catch { /* storage blocked */ }
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key === "className") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.token }
  });
  if (response.status === 401) { showPairing(); throw new Error("unpaired"); }
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2500);
}

function mediaUrl(partId, size) {
  return `/api/media/${encodeURIComponent(partId)}?size=${size}&token=${encodeURIComponent(state.token)}`;
}

function colorFor(text) {
  let hash = 2166136261;
  for (const c of text) { hash ^= c.charCodeAt(0); hash = Math.imul(hash, 16777619) >>> 0; }
  return PALETTE[hash % PALETTE.length];
}

function initials(name) {
  const words = name.split(" ").filter(w => /[\p{L}\p{N}]/u.test(w)).slice(0, 2);
  return words.map(w => [...w].find(ch => /[\p{L}\p{N}]/u.test(ch)) || "").join("").toUpperCase() || "#";
}

function shortTime(ms) {
  const d = new Date(ms), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const days = (now - d) / 86400000;
  if (days < 7) return d.toLocaleDateString([], { weekday: "short" });
  return d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}

// Pairing ---------------------------------------------------------------------------------------

function showPairing() {
  writeToken(null);
  state.token = null;
  if (state.events) { state.events.close(); state.events = null; }
  $("app").hidden = true;
  $("pair").hidden = false;
  $("code").value = "";
  $("code").focus();
}

$("pairForm").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("code").value.trim();
  $("pairError").textContent = "";
  $("pairButton").disabled = true;
  try {
    const response = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    const body = await response.json().catch(() => ({}));
    if (response.ok && body.token) {
      state.token = body.token;
      writeToken(body.token);
      startApp();
    } else if (body.error === "locked") {
      $("pairError").textContent = "Too many tries — wait a minute, then try again.";
    } else {
      $("pairError").textContent = "That code didn't match — check the code on your phone.";
    }
  } catch {
    $("pairError").textContent = "Can't reach your phone. Is Computer access still on?";
  } finally {
    $("pairButton").disabled = false;
  }
});

// Conversation list -----------------------------------------------------------------------------

async function loadConversations() {
  try {
    state.conversations = await api(`/api/conversations?lane=${state.lane}`);
    if (!$("search").value.trim()) renderList();
  } catch { /* shown by banner or pairing */ }
}

function conversationButton(c) {
  const button = el("button", {
    className: "conv" + (c.unread ? " unread" : "") + (state.current && state.current.id === c.id ? " active" : ""),
    onclick: () => openConversation(c)
  },
    el("span", { className: "avatar", style: `background:${colorFor(c.address || c.name)}`, text: c.isGroup ? "👥" : initials(c.name) }),
    el("span", { className: "conv-main" },
      el("span", { className: "conv-top" },
        el("span", { className: "conv-name", text: c.name + (c.isMuted ? " 🔕" : "") }),
        el("span", { className: "conv-time", text: shortTime(c.ms) })),
      el("span", { className: "conv-preview", text: c.preview || "" })));
  return button;
}

function renderList() {
  const list = $("list");
  list.replaceChildren(...state.conversations.map(conversationButton));
  if (state.conversations.length === 0) list.append(el("div", { className: "muted-note", text: "Nothing here." }));
}

document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
  state.lane = tab.dataset.lane;
  $("search").value = "";
  loadConversations();
}));

// Search ----------------------------------------------------------------------------------------

function highlighted(body, query) {
  const i = body.toLowerCase().indexOf(query.toLowerCase());
  if (i < 0) return el("span", { text: body.length > 90 ? body.slice(0, 90) + "…" : body });
  const start = Math.max(0, i - 30), end = Math.min(body.length, i + query.length + 50);
  return el("span", {},
    (start > 0 ? "…" : "") + body.slice(start, i),
    el("mark", { text: body.slice(i, i + query.length) }),
    body.slice(i + query.length, end) + (end < body.length ? "…" : ""));
}

$("search").addEventListener("input", () => {
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(runSearch, 250);
});

async function runSearch() {
  const query = $("search").value.trim();
  if (query.length < 2) { renderList(); return; }
  const lowered = query.toLowerCase();
  const nameMatches = state.conversations.filter(c => c.name.toLowerCase().includes(lowered));
  let results = [];
  try { results = await api(`/api/search?q=${encodeURIComponent(query)}`); } catch { return; }
  if ($("search").value.trim() !== query) return;
  const list = $("list");
  list.replaceChildren();
  if (nameMatches.length) {
    list.append(el("div", { className: "section-label", text: "Conversations" }), ...nameMatches.map(conversationButton));
  }
  list.append(el("div", { className: "section-label", text: "Messages" }));
  if (results.length === 0) list.append(el("div", { className: "muted-note", text: "No messages found." }));
  for (const r of results) {
    list.append(el("button", {
      className: "conv",
      onclick: () => openConversation(state.conversations.find(c => c.id === r.threadId) || { id: r.threadId, name: r.conversationName, address: r.address, isGroup: false })
    },
      el("span", { className: "conv-main" },
        el("span", { className: "conv-top" },
          el("span", { className: "conv-name", text: r.conversationName }),
          el("span", { className: "conv-time", text: shortTime(r.ms) })),
        el("span", { className: "conv-preview" }, r.outgoing ? "You: " : "", highlighted(r.body, query)))));
  }
}

// Conversation ------------------------------------------------------------------------------------

async function openConversation(c) {
  state.current = c;
  state.messages = [];
  state.hasMore = true;
  state.before = null;
  $("threadName").textContent = c.name;
  $("empty").hidden = true;
  $("thread").hidden = false;
  $("app").classList.add("show-thread");
  $("messages").replaceChildren(el("div", { className: "muted-note", text: "Loading…" }));
  document.querySelectorAll(".conv.active").forEach(b => b.classList.remove("active"));
  await reloadMessages(true);
  if (c.unread) {
    c.unread = false;
    api(`/api/conversations/${c.id}/read`, { method: "POST" }).then(loadConversations).catch(() => {});
  }
  $("reply").focus();
}

async function reloadMessages(scrollToEnd) {
  const c = state.current;
  if (!c) return;
  const box = $("messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let page;
  try { page = await api(`/api/conversations/${c.id}/messages`); } catch { return; }
  if (state.current !== c) return;
  state.reloads++;
  // Keep what the user already scrolled back through; only the newest page is refreshed.
  const oldest = page.messages.length ? page.messages[0].ms : Infinity;
  const kept = state.messages.filter(m => m.ms < oldest);
  if (kept.length === 0) {
    state.hasMore = page.hasMore;
    state.before = page.before;
  }
  state.messages = kept.concat(page.messages);
  renderMessages();
  if (scrollToEnd || nearBottom) box.scrollTop = box.scrollHeight;
}

async function loadOlder() {
  const c = state.current;
  if (!c || state.loadingOlder || !state.hasMore || state.before == null) return;
  state.loadingOlder = true;
  const box = $("messages");
  const previousHeight = box.scrollHeight;
  const reloads = state.reloads;
  try {
    const older = await api(`/api/conversations/${c.id}/messages?before=${state.before}`);
    if (state.current !== c || state.reloads !== reloads) return;
    state.hasMore = older.hasMore;
    if (older.before != null) state.before = older.before;
    state.messages = older.messages.concat(state.messages);
    renderMessages();
    box.scrollTop = box.scrollHeight - previousHeight;
  } catch { /* try again on the next scroll */ }
  finally { state.loadingOlder = false; }
}

$("messages").addEventListener("scroll", () => { if ($("messages").scrollTop < 80) loadOlder(); });

function linkified(text) {
  const parts = [];
  const pattern = /\b(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
  let last = 0, match;
  while ((match = pattern.exec(text)) !== null) {
    if (match.index > last) parts.push(text.slice(last, match.index));
    const url = match[0].replace(/[.,!?)]+$/, "");
    const href = url.startsWith("www.") ? "https://" + url : url;
    parts.push(el("a", { href, target: "_blank", rel: "noopener noreferrer", text: url }));
    last = match.index + url.length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}

function renderMessages() {
  const c = state.current;
  const box = $("messages");
  const nodes = [];
  let lastDay = null;
  for (const m of state.messages) {
    const day = new Date(m.ms).toDateString();
    if (day !== lastDay) {
      nodes.push(el("div", { className: "day", text: new Date(m.ms).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" }) }));
      lastDay = day;
    }
    const images = m.attachments.filter(a => a.kind === "image" || a.kind === "gif");
    const others = m.attachments.filter(a => a.kind !== "image" && a.kind !== "gif");
    const bubble = el("div", { className: "bubble" + (!m.body && images.length && !others.length ? " photo-only" : "") });
    if (m.body) bubble.append(...linkified(m.body));
    for (const a of images) {
      bubble.append(el("img", { src: mediaUrl(a.partId, 480), alt: a.name, loading: "lazy", onclick: () => openViewer(a.partId) }));
    }
    for (const a of others) {
      const icon = a.kind === "video" ? "🎬" : a.kind === "audio" ? "🎤" : a.kind === "contact" ? "👤" : "📎";
      bubble.append(el("div", { className: "attach", text: `${icon} ${a.kind === "audio" ? "Voice message (play it on your phone)" : a.name}` }));
    }
    const msg = el("div", { className: "msg " + (m.outgoing ? "out" : "in") },
      c && c.isGroup && !m.outgoing ? el("div", { className: "sender", text: m.senderName || "" }) : null,
      bubble,
      m.reactions && m.reactions.length ? el("div", { className: "reactions", text: m.reactions.join("") }) : null,
      el("div", { className: "meta", text: new Date(m.ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + (m.outgoing && m.status ? " · " + m.status : "") }));
    nodes.push(msg);
  }
  box.replaceChildren(...nodes);
  if (nodes.length === 0) box.append(el("div", { className: "muted-note", text: "No messages yet." }));
}

$("reply").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("reply").addEventListener("input", () => {
  const r = $("reply");
  r.style.height = "auto";
  r.style.height = Math.min(r.scrollHeight, 160) + "px";
});

$("composer").addEventListener("submit", async e => {
  e.preventDefault();
  const c = state.current;
  const text = $("reply").value.trim();
  if (!c || !text || state.sending) return;
  state.sending = true;
  $("sendButton").disabled = true;
  try {
    await api(`/api/conversations/${c.id}/reply`, { method: "POST", body: JSON.stringify({ address: c.address, text }) });
    $("reply").value = "";
    $("reply").style.height = "auto";
    toast("Sent from your phone");
    setTimeout(() => { reloadMessages(true); loadConversations(); }, 1500);
  } catch {
    toast("Couldn't send — is your phone still connected?");
  } finally {
    state.sending = false;
    $("sendButton").disabled = false;
  }
});

$("back").addEventListener("click", () => {
  $("app").classList.remove("show-thread");
  state.current = null;
});

function openViewer(partId) {
  $("viewerImg").src = mediaUrl(partId, 1600);
  $("viewer").hidden = false;
}
$("viewer").addEventListener("click", () => { $("viewer").hidden = true; $("viewerImg").removeAttribute("src"); });

// New message -------------------------------------------------------------------------------------

function renderChips() {
  $("chips").replaceChildren(...state.recipients.map((r, i) =>
    el("button", { className: "chip", type: "button", title: "Remove", onclick: () => { state.recipients.splice(i, 1); renderChips(); } }, `${r.name} ✕`)));
}

function addRecipient(name, number) {
  if (!state.recipients.some(r => r.number === number)) state.recipients.push({ name, number });
  renderChips();
  $("to").value = "";
  $("suggestions").hidden = true;
  $("to").focus();
}

$("newButton").addEventListener("click", () => {
  state.recipients = [];
  renderChips();
  $("to").value = "";
  $("newText").value = "";
  $("newError").textContent = "";
  $("suggestions").hidden = true;
  $("newDialog").hidden = false;
  $("to").focus();
});
$("newCancel").addEventListener("click", () => { $("newDialog").hidden = true; });

$("to").addEventListener("input", () => {
  clearTimeout(state.contactTimer);
  state.contactTimer = setTimeout(async () => {
    const query = $("to").value.trim();
    if (!query) { $("suggestions").hidden = true; return; }
    let contacts = [];
    try { contacts = await api(`/api/contacts?q=${encodeURIComponent(query)}`); } catch { return; }
    const box = $("suggestions");
    box.replaceChildren(...contacts.map(c => el("button", { className: "suggestion", type: "button", onclick: () => addRecipient(c.name, c.number) },
      c.name, el("small", { text: c.number }))));
    box.hidden = contacts.length === 0;
  }, 200);
});

$("to").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const value = $("to").value.trim();
  if (/^[+\d][\d\s().-]{2,}$/.test(value)) addRecipient(value, value);
});

$("newForm").addEventListener("submit", async e => {
  e.preventDefault();
  const typed = $("to").value.trim();
  if (typed && /^[+\d][\d\s().-]{2,}$/.test(typed)) addRecipient(typed, typed);
  const text = $("newText").value.trim();
  if (state.recipients.length === 0) { $("newError").textContent = "Add at least one person."; return; }
  if (!text) { $("newError").textContent = "Type a message."; return; }
  if (state.sending) return;
  state.sending = true;
  try {
    await api("/api/messages/new", { method: "POST", body: JSON.stringify({ to: state.recipients.map(r => r.number), text }) });
    $("newDialog").hidden = true;
    toast(state.recipients.length > 1 ? "Group message sent from your phone" : "Sent from your phone");
    setTimeout(loadConversations, 1500);
  } catch {
    $("newError").textContent = "Couldn't send — is your phone still connected?";
  } finally {
    state.sending = false;
  }
});

// Live updates --------------------------------------------------------------------------------------

function connectEvents() {
  if (state.events) state.events.close();
  const events = new EventSource(`/api/events?token=${encodeURIComponent(state.token)}`);
  state.events = events;
  events.onopen = () => { $("banner").hidden = true; };
  events.onerror = () => { $("banner").hidden = false; };
  events.onmessage = e => {
    let event;
    try { event = JSON.parse(e.data); } catch { return; }
    if (event.type !== "message") return;
    loadConversations();
    if (state.current && state.current.id === event.threadId) reloadMessages(false);
  };
}

function startApp() {
  $("pair").hidden = true;
  $("app").hidden = false;
  loadConversations();
  connectEvents();
}

// Fallback for anything the live stream misses (e.g. texts sent from the phone itself).
setInterval(() => {
  if (!state.token || document.hidden) return;
  loadConversations();
  if (state.current) reloadMessages(false);
}, 30000);

if (state.token) startApp(); else showPairing();
</script>
</body>
</html>
